<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AF-Tech | المنتجات</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* تنسيق الزر العائم للسلة */
    .floating-cart-btn {
      position: fixed;
      bottom: 25px;
      left: 25px;
      background: #20a4ff;
      color: #fff;
      padding: 12px 20px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(32, 164, 255, 0.4);
      cursor: pointer;
      font-weight: bold;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 2px solid #fff;
      transition: 0.3s;
    }
    .floating-cart-btn:hover { background: #1182d3; transform: scale(1.05); }

    /* تنسيق نافذة السلة المنبثقة Modal */
    .cart-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 12, 20, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .cart-content {
      background: #0b1928;
      border: 1px solid #1a2d42;
      border-radius: 16px;
      width: 90%;
      max-width: 450px;
      padding: 20px;
      color: #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a2d42; padding-bottom: 10px; margin-bottom: 15px; }
    .cart-items { flex: 1; overflow-y: auto; max-height: 50vh; margin-bottom: 15px; }
    .cart-item-row { display: flex; justify-content: space-between; align-items: center; background: #050c14; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
    .cart-actions-qty { display: flex; align-items: center; gap: 8px; }
    .cart-actions-qty button { background: #20a4ff; color: #fff; border: none; width: 25px; height: 25px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .cart-actions-qty button.danger { background: #e63946; }
    .cart-footer { border-top: 1px solid #1a2d42; padding-top: 12px; font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
    .close-modal { background: transparent; border: none; color: #8fa7ba; font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span>AF</span>-Tech</a>
  <div style="display: flex; align-items: center; gap: 15px;">
    <a href="auth.html" class="btn primary" id="authBtn">تسجيل الدخول</a>
    <button class="menu-btn" id="menuBtn">☰</button>
  </div>
  <nav id="nav">
    <a href="index.html">الرئيسية</a>
    <a href="products.html" class="active">المنتجات</a>
    <a href="community.html">المنتدى</a>
    <a href="chat.html">المحادثات 💬</a>
  </nav>
</header>

<main class="section">
  <div class="section-head">
    <p class="eyebrow">المتجر الكامل</p>
    <h2>جميع المنتجات والأقسام</h2>
  </div>

  <div class="filters" id="productFilters">
    <button class="filter active" data-cat="all">الكل</button>
    <button class="filter" data-cat="receivers">ريسيفرات</button>
    <button class="filter" data-cat="dish">مستلزمات الدش</button>
    <button class="filter" data-cat="electrical">أجهزة كهربائية</button>
    <button class="filter" data-cat="pos">سيستم حسابات</button>
    <button class="filter" data-cat="printers">مستلزمات كمبيوتر</button>
    <button class="filter" data-cat="computers">كمبيوتر</button>
    <button class="filter" data-cat="cameras">كاميرات</button>
    <button class="filter" data-cat="screens">سبيكرات</button>
    <button class="filter" data-cat="cables">كابلات</button>
  </div>

  <!-- خانة البحث في المنتجات -->
  <div style="margin: 20px 0; max-width: 600px; margin-left: auto; margin-right: auto;">
    <input type="text" id="productSearchInput" placeholder="🔍 ابحث بالاسم، الوصف، أو السعر..." oninput="filterProductsSearch()" style="width: 100%; padding: 12px; background: #0b132b; border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
  </div>

  <div class="products" id="productsGrid"></div>
</main>

<!-- زر السلة العائم -->
<div class="floating-cart-btn" onclick="toggleCartModal()">
  🛒 سلة المشتريات (<span id="cartCount">0</span>)
</div>

<!-- نافذة السلة المنبثقة -->
<div class="cart-modal" id="cartModal">
  <div class="cart-content">
    <div class="cart-header">
      <h3 style="margin:0; font-size:18px;">🛒 سلة المشتريات</h3>
      <button class="close-modal" onclick="toggleCartModal()">✕</button>
    </div>
    <div class="cart-items" id="cartItemsContainer">
      <p style="text-align:center; color:#8fa7ba;">السلة فارغة حالياً</p>
    </div>
    <div class="cart-footer">
      <span id="cartTotalText">إجمالي السعر: 0 جنيه</span>
      <button class="btn primary" onclick="checkoutCart()" style="padding: 6px 14px; font-size: 14px;">إتمام الطلب</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<footer>Under the management of Eng. Ahmed El Dahrawy</footer>
<script src="app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if(typeof renderProducts === 'function') renderProducts();
    if(typeof updateCartUI === 'function') updateCartUI();
  });
</script>
</body>
</html>
